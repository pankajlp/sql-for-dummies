<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Byte's SQL Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticker-book map on graph paper. Chunky ink outlines, hard offset shadows, one bright sticker per job. */
:root{
  --paper:#EEF5FF; --grid:#D9E6FA; --card:#FFFFFF; --card-2:#F6F9FF;
  --ink:#1C2448; --ink-soft:#56608C; --line:#1C2448; --shadow:#1C2448;
  --pink:#FF5C8A; --sun:#FFC83A; --mint:#20C996; --sky:#3FA9F5; --grape:#8B6CFF; --orange:#FF8A3D;
  --good:#16B47F; --bad:#F2584A; --good-bg:#DDF8EE; --bad-bg:#FFE3DF;
  --on-accent:#1C2448; --locked:#C9D3E6;
  --code-bg:#1C2448; --code-fg:#EEF3FF; --code-kw:#FF7BA3; --code-str:#FFD25E; --code-num:#5FE3B5; --code-id:#8CCBFF; --code-com:#8590B8;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141936; --grid:#1D2448; --card:#20284F; --card-2:#262F5A;
  --ink:#EEF2FF; --ink-soft:#A9B2D9; --line:#5B67A6; --shadow:#080B1E;
  --good-bg:#11402F; --bad-bg:#4A1F22; --locked:#3A4370;
  --code-bg:#0C1029; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#141936; --grid:#1D2448; --card:#20284F; --card-2:#262F5A;
  --ink:#EEF2FF; --ink-soft:#A9B2D9; --line:#5B67A6; --shadow:#080B1E;
  --good-bg:#11402F; --bad-bg:#4A1F22; --locked:#3A4370;
  --code-bg:#0C1029; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.88em;background:var(--card-2);border:1.5px solid var(--line);border-radius:7px;padding:1px 6px;white-space:nowrap}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:12px 10px;background:var(--paper)}
.topbar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1080px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;padding:0}
.brand-mini{width:46px;height:56px;flex:none}
.brand-name{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1;text-align:left}
.brand-name small{display:block;font-family:var(--body);font-size:.72rem;font-weight:800;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.stats{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:2.5px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:3px 3px 0 var(--shadow);white-space:nowrap}
.pill svg{flex:none}
.pill.bump{animation:bump .5s}
.lvl-bar{width:58px;height:8px;border-radius:9px;background:var(--grid);overflow:hidden;border:1.5px solid var(--line)}
.lvl-bar i{display:block;height:100%;background:var(--grape);border-radius:9px;transition:width .6s}
.btn-break{background:var(--mint);color:var(--on-accent)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-4deg)}100%{transform:scale(1)}}

/* ---------- nav ---------- */
.tabs{display:flex;gap:8px;max-width:1080px;margin:4px auto 18px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:7px;padding:8px 14px;border:2.5px solid var(--line);border-radius:14px;background:var(--card);font-family:var(--display);font-weight:600;font-size:1rem;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);transition:transform .12s}
.tab:hover{transform:translate(-1px,-2px)}
.tab[aria-current="page"]{background:var(--sun);color:var(--on-accent)}
.tab svg{width:20px;height:20px}
@media (max-width:720px){
  .tabs{position:fixed;bottom:0;left:0;right:0;margin:0;z-index:30;background:var(--card);border-top:2.5px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:2px;flex-wrap:nowrap;justify-content:space-around}
  .tab{flex-direction:column;gap:1px;font-size:.68rem;padding:5px 4px;border:0;box-shadow:none;background:none;border-radius:10px;flex:1;min-width:0}
  .tab[aria-current="page"]{background:var(--sun)}
  .brand-name small{display:none}
  .pill .lvl-bar{display:none}
}

/* ---------- generic ---------- */
.card{background:var(--card);border:2.5px solid var(--line);border-radius:var(--r);box-shadow:5px 5px 0 var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--line);border-radius:14px;padding:11px 20px;font-family:var(--display);font-weight:600;font-size:1.08rem;cursor:pointer;background:var(--card);box-shadow:4px 4px 0 var(--shadow);transition:transform .1s, box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shadow)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.go{background:var(--mint);color:var(--on-accent)}
.btn.hot{background:var(--pink);color:var(--on-accent)}
.btn.sun{background:var(--sun);color:var(--on-accent)}
.btn.sky{background:var(--sky);color:var(--on-accent)}
.btn.big{font-size:1.25rem;padding:14px 28px}
.btn.small{font-size:.92rem;padding:7px 12px;border-radius:11px;box-shadow:3px 3px 0 var(--shadow)}
.muted{color:var(--ink-soft)}
.eyebrow{font-weight:900;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.view-in{animation:viewIn .35s ease-out}
@keyframes viewIn{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}
.h-page{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:700}
.lead{max-width:62ch;margin:.4rem 0 1.2rem;color:var(--ink-soft);font-weight:700}

/* ---------- byte mascot ---------- */
.byte{overflow:visible;display:block}
.byte .body{transform-origin:60px 146px;animation:bob 2.6s ease-in-out infinite}
.byte .eyes{transform-origin:60px 70px;animation:blink 4.2s infinite}
.byte .arm-r{transform-origin:98px 84px}
.byte .arm-l{transform-origin:22px 84px}
.byte.mood-happy .body{animation:jump .55s ease-in-out infinite}
.byte.mood-happy .arm-r{animation:wave .35s ease-in-out infinite alternate}
.byte.mood-happy .arm-l{animation:wave2 .35s ease-in-out infinite alternate}
.byte.mood-sad .body{animation:wobble .6s ease-in-out 2}
.byte.mood-think .pupil{transform:translate(2px,-3px)}
.byte.mood-dance .body{animation:dance 1s ease-in-out infinite}
.byte.mood-dance .arm-r{animation:wave .25s ease-in-out infinite alternate}
.byte.mood-dance .arm-l{animation:wave2 .25s ease-in-out infinite alternate}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.08,.9)}55%{transform:translateY(-22px) scale(.95,1.06)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes wave{from{transform:rotate(0)}to{transform:rotate(-40deg)}}
@keyframes wave2{from{transform:rotate(0)}to{transform:rotate(40deg)}}
@keyframes dance{0%,100%{transform:rotate(-10deg) translateY(0)}25%{transform:translateY(-14px)}50%{transform:rotate(10deg) translateY(0)}75%{transform:translateY(-14px)}}

/* ---------- map ---------- */
.home-hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px 22px;margin-bottom:26px}
.home-hero h1{font-size:clamp(1.6rem,3.6vw,2.3rem)}
.home-hero p{margin:.3rem 0 .8rem;font-weight:700;color:var(--ink-soft);max-width:56ch}
@media (max-width:560px){.home-hero{grid-template-columns:1fr;text-align:center}.home-hero .byte{margin:0 auto}.home-hero .row{justify-content:center}}
.map{position:relative;padding-bottom:30px}
.map-path{position:absolute;inset:0;pointer-events:none;overflow:visible}
.world{position:relative;margin:0 0 10px}
.world-banner{display:flex;gap:14px;align-items:center;padding:14px 18px;max-width:560px;margin:0 auto 22px;position:relative;z-index:2}
.world-badge{flex:none;width:54px;height:54px;border-radius:16px;border:2.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--on-accent)}
.world-banner h2{font-size:1.4rem}
.world-banner .eyebrow{margin-bottom:2px}
.world-prog{margin-left:auto;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap}
.nodes{display:flex;flex-direction:column;gap:26px;margin-bottom:34px}
.node-row{position:relative;height:96px}
.node{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;padding:0;z-index:2;width:150px}
.node-dot{width:78px;height:78px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.6rem;box-shadow:0 6px 0 var(--shadow);transition:transform .15s;color:var(--on-accent);position:relative}
.node:hover .node-dot{transform:translateY(-4px) scale(1.05)}
.node.locked{cursor:not-allowed}
.node.locked .node-dot{background:var(--locked)!important;color:var(--ink-soft)}
.node.current .node-dot::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:4px solid var(--sun);animation:ring 1.4s ease-out infinite}
.node.boss .node-dot{width:92px;height:92px;border-radius:28px}
.node-label{font-family:var(--display);font-weight:600;font-size:.95rem;text-align:center;line-height:1.15;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:2px 8px;max-width:150px}
.stars{display:flex;gap:1px;position:absolute;top:-14px;left:50%;transform:translateX(-50%)}
.node-byte{position:absolute;top:-30px;width:62px;z-index:3;pointer-events:none}
@keyframes ring{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.3);opacity:0}}

/* ---------- player ---------- */
.player{max-width:900px;margin:0 auto}
.player-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.icon-btn{width:44px;height:44px;flex:none;border-radius:12px;border:2.5px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;box-shadow:3px 3px 0 var(--shadow);font-weight:900;font-size:1.1rem}
.pbar{flex:1;display:flex;gap:4px;min-width:0}
.pbar i{flex:1;height:14px;border-radius:9px;background:var(--grid);border:2px solid var(--line);transition:background .3s}
.pbar i.on{background:var(--mint)}
.pbar i.now{background:var(--sun);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scaleY(1.25)}}
.hearts{display:flex;gap:2px}
.hearts .heart.lost{filter:grayscale(1);opacity:.35;animation:heartbreak .6s}
@keyframes heartbreak{30%{transform:scale(1.5) rotate(-15deg)}}
.stage{animation:slideIn .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px) rotate(1deg)}to{opacity:1;transform:none}}
.talk{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:end}
@media (max-width:620px){.talk{grid-template-columns:90px 1fr}.talk .byte{width:90px!important;height:auto}}
.bubble{position:relative;padding:20px 22px;font-size:1.18rem;font-weight:700;min-width:0}
.bubble::before{content:"";position:absolute;left:-16px;bottom:30px;border:14px solid transparent;border-right-color:var(--line);border-left:0}
.bubble::after{content:"";position:absolute;left:-11px;bottom:32px;border:12px solid transparent;border-right-color:var(--card);border-left:0}
.bubble p{margin:0 0 .5em}.bubble p:last-child{margin:0}
.step-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px;flex-wrap:wrap}
.q-title{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:0 0 14px;line-height:1.25}
.q-card{padding:22px}
.opts{display:grid;gap:12px}
.opt{text-align:left;padding:14px 18px;border:2.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-weight:800;font-size:1.08rem;box-shadow:3px 3px 0 var(--shadow);display:flex;gap:12px;align-items:center;transition:transform .1s}
.opt:hover{transform:translateX(4px)}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);background:var(--card-2)}
.opt.right{background:var(--good-bg);border-color:var(--good);animation:pop .4s}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);animation:shake .4s}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.why{margin-top:14px;padding:12px 16px;border-radius:14px;border:2px dashed var(--line);font-weight:700;animation:viewIn .3s}
.sqlblock{font-family:var(--mono);background:var(--code-bg);color:var(--code-fg);border-radius:14px;padding:14px 16px;margin:6px 0 16px;overflow-x:auto;white-space:pre-wrap;font-size:1rem;border:2.5px solid var(--line)}
.t-kw{color:var(--code-kw);font-weight:700}.t-str{color:var(--code-str)}.t-num{color:var(--code-num)}.t-id{color:var(--code-id)}.t-com{color:var(--code-com);font-style:italic}

/* tables */
.tbl-wrap{overflow-x:auto;border:2.5px solid var(--line);border-radius:14px;background:var(--card);max-width:100%}
table.data{border-collapse:collapse;font-size:.92rem;width:100%;font-variant-numeric:tabular-nums}
table.data th{font-family:var(--mono);font-size:.8rem;text-align:left;padding:7px 12px;background:var(--sun);color:var(--on-accent);border-bottom:2.5px solid var(--line);white-space:nowrap}
table.data td{padding:6px 12px;border-top:1.5px solid var(--grid);white-space:nowrap;font-weight:700}
table.data tr:nth-child(even) td{background:var(--card-2)}
table.data td.null{color:var(--ink-soft);font-style:italic;font-weight:500}
table.data tbody tr{animation:rowIn .35s backwards}
@keyframes rowIn{from{opacity:0;transform:translateX(-12px)}}
.tbl-cap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 6px;font-weight:900}
.tbl-cap .muted{font-size:.85rem}
.more{font-size:.85rem;color:var(--ink-soft);padding:6px 12px;font-weight:700}

/* code task */
.task-q{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:0 0 14px;line-height:1.3}
.task-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.task-grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.editor{position:relative;font:500 16px/1.55 var(--mono);background:var(--code-bg);border:2.5px solid var(--line);border-radius:14px;box-shadow:4px 4px 0 var(--shadow)}
.editor pre,.editor textarea{margin:0;padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;border:0;font:inherit;letter-spacing:0;tab-size:2}
.editor pre{min-height:132px;color:var(--code-fg);pointer-events:none}
.editor textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;color:transparent;caret-color:var(--sun);outline:none;overflow:hidden;border-radius:14px}
.editor:focus-within{outline:3px solid var(--sky);outline-offset:2px}
.editor .ph{position:absolute;left:16px;top:14px;color:var(--code-com);pointer-events:none;font-style:italic}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-weight:700;font-size:.86rem;padding:5px 10px;border-radius:9px;border:2px solid var(--line);background:var(--card);cursor:pointer;box-shadow:2px 2px 0 var(--shadow);transition:transform .1s}
.chip:hover{transform:translateY(-2px)}
.chip.kw{background:var(--pink);color:var(--on-accent)}
.chip.tb{background:var(--sun);color:var(--on-accent)}
.chip.cl{background:var(--sky);color:var(--on-accent)}
.chip.used{opacity:.25;pointer-events:none}
.msg{padding:14px 16px;border-radius:14px;border:2.5px solid var(--line);font-weight:800;animation:viewIn .3s}
.msg.good{background:var(--good-bg);border-color:var(--good)}
.msg.bad{background:var(--bad-bg);border-color:var(--bad)}
.msg.info{background:var(--card-2)}
.msg .big{font-family:var(--display);font-size:1.3rem;display:block;margin-bottom:2px}
.hintbox{padding:12px 16px;border-radius:14px;border:2.5px dashed var(--sun);background:var(--card);font-weight:700}
.hintbox b{color:var(--orange)}
.ai-ans{white-space:pre-wrap}

/* build */
.build-slot{min-height:64px;padding:12px;border:2.5px dashed var(--line);border-radius:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--code-bg)}
.build-slot .chip{animation:pop .25s}
.build-slot:empty::before{content:"Tap the blocks below to build your spell";color:var(--code-com);font-style:italic;font-family:var(--mono);font-size:.9rem}
.build-bank{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.build-bank .chip,.build-slot .chip{font-size:1.02rem;padding:8px 14px}

/* boss */
.boss-arena{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:12px 18px;margin-bottom:18px}
.boss-arena .boss{width:110px;height:110px}
.hpbar{height:22px;border-radius:12px;border:2.5px solid var(--line);background:var(--grid);overflow:hidden;margin-top:6px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--orange));transition:width .5s cubic-bezier(.3,1.6,.5,1)}
.boss.hit{animation:hit .5s}
.boss.laugh{animation:laugh .5s 2}
.boss-svg .bb{transform-origin:60px 70px;animation:bossbob 1.8s ease-in-out infinite}
@keyframes bossbob{50%{transform:translateY(-6px) rotate(3deg)}}
@keyframes hit{0%{filter:none}20%{transform:translateX(14px) rotate(10deg);filter:brightness(2.2)}60%{transform:translateX(-8px)}100%{transform:none}}
@keyframes laugh{50%{transform:scale(1.12) rotate(-5deg)}}

/* finish */
.finish{text-align:center;padding:30px 20px;max-width:620px;margin:0 auto}
.finish .byte{margin:0 auto}
.big-stars{display:flex;justify-content:center;gap:10px;margin:12px 0}
.big-stars svg{animation:starIn .6s cubic-bezier(.2,1.6,.4,1) backwards}
.big-stars svg:nth-child(2){animation-delay:.25s}.big-stars svg:nth-child(3){animation-delay:.5s}
@keyframes starIn{from{transform:scale(0) rotate(-180deg)}}
.reward-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px 0 18px}
.journal{margin:18px 0;text-align:left}
.journal textarea,.field{width:100%;border:2.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-weight:700;background:var(--card-2);color:var(--ink);resize:vertical}

/* arena / projects / cards grid */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.pcard{padding:18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;transition:transform .12s}
.pcard:hover{transform:translate(-2px,-3px)}
.pcard.locked{cursor:not-allowed;opacity:.65}
.pcard h3{font-size:1.2rem}

   Q("Question: \"Which cats are older than 3?\" Which pets do we want?", ["All the pets","Only cats older than 3","Only dogs"], 1, "Yes. That's the 'which ones?' question. It becomes the WHERE part of SQL."),
   Q("Question: \"List all the owners' cities.\" What do we want to SEE?", ["The city","The pet's color","Their weight"], 0, "Yes. 'What to see' becomes the SELECT part."),
   T("**Detective trick: Imagine the answer first.** Before typing, picture the little table you expect. In every puzzle I'll show you what I want to see, so you can compare."),
   T("**Builder trick: Build little, run often.** Write a tiny query, run it, then add one more piece. Like stacking Lego one block at a time.", {art:'tiny'}),
   Q("Your long query shows an error. What's the best first move?", ["Delete everything and cry","Make it smaller and run each piece","Add random words until it works"], 1, "Exactly. Shrink it, find the broken block, fix it. Real engineers do this all day."),
   T("You now know how to learn AND how to think. That's the hardest part! Now let's go meet the data. 🚀"),
  ]},
 ]},
 {id:'w1', name:'Table Town', sub:'Tables, rows, columns and SELECT', color:'sky', lessons:[
  {id:'w1a', title:'What is a Database?', steps:[
   T("A **database** is like a super-organized toy cupboard. Inside are **tables**. A table is a grid, like your school timetable."),
   T("This is the **pets** table in Pet Town. Each **row** goes across: it's one pet. Each **column** goes down: it's one fact about every pet.", {art:'anatomy'}),
   T("Here's the full pets table. Take a look at the pets. Which one is your favorite?", {show:'pets'}),
   Q("In the pets table, what is one ROW?", ["One pet with all its facts","All the names","The title of the table"], 0, "Yes! One row = one thing (here, one pet)."),
   Q("What is a COLUMN?", ["A pillar holding up a building","One fact about every pet, like color","One pet"], 1, "Right. Columns are like 'color' or 'age'. (A pillar is a different kind of column 😄)"),
   T("See the **id** column? Every pet has its own special number that no other pet has, like your roll number in class."),
   Q("Momo has id 1. Can another pet also have id 1?", ["Yes","No, every id is unique"], 1, "Correct. Unique ids help us never mix up two pets with the same name."),
   T("Pet Town also has an **owners** table. Look at **owner_id** in pets: it's the id of the pet's owner. That's how tables hold hands!", {show:'owners'}),
   Q("Momo's owner_id is 1. Who is Momo's owner?", ["Riya","Kabir","Meera"], 0, "Yes! Owner with id 1 is Riya. You just connected two tables in your head."),
  ]},
  {id:'w1b', title:'Your First Spell: SELECT', steps:[
   T("SQL is a spell language. Your first spell:", {code:"SELECT * FROM pets;"}),
   T("It means: **\"Show me everything from the pets table.\"** The star `*` means \"all columns\". The `;` at the end is like a full stop."),
   C("Cast your first spell! Type `SELECT * FROM pets;` and press **Run**.", "SELECT * FROM pets", {hints:["Type exactly: SELECT * FROM pets;","You can tap the colorful blocks under the editor instead of typing."]}),
   T("WOW. You just talked to a database! 🎉 Engineers at big companies type spells like this every day."),
   C("Now show everything from the **owners** table.", "SELECT * FROM owners", {hints:["Same spell, different table name.","SELECT * FROM owners;"]}),
   T("Don't want everything? Name the columns you want, with commas between them:", {code:"SELECT name, animal FROM pets;"}),
   B("Build a spell that shows just the **names** of all pets.", "SELECT name FROM pets", {extra:["*","animal","owners"]}),
   C("Show the **name** and **color** of every pet.", "SELECT name, color FROM pets", {hints:["SELECT column1, column2 FROM table","SELECT name, color FROM pets;"]}),
   C("Show each owner's **name** and **city**.", "SELECT name, city FROM owners", {hints:["Which table has cities? owners!","SELECT name, city FROM owners;"]}),
   Q("What does `*` mean in `SELECT *`?", ["Multiply","All columns","A superstar pet"], 1, "Yes! * means all columns."),
  ]},
 ]},
 {id:'w2', name:'Filter Forest', sub:'WHERE, AND, OR', color:'mint', lessons:[
  {id:'w2a', title:'WHERE: The Magic Filter', steps:[
   T("**WHERE** is a filter, like a sieve. Only the rows that pass the test come through.", {art:'filter'}),
   T("To get only the dogs:", {code:"SELECT * FROM pets WHERE animal = 'dog';"}),
   T("Words (text) go inside **'single quotes'**. Numbers don't need quotes. So it's `animal = 'dog'` but `age = 3`."),
   C("Show all the **dogs** (all columns).", "SELECT * FROM pets WHERE animal = 'dog'", {hints:["Add WHERE animal = 'dog' after FROM pets","SELECT * FROM pets WHERE animal = 'dog';"]}),
   C("Show only the **names** of the **cats**.", "SELECT name FROM pets WHERE animal = 'cat'", {hints:["SELECT name ... WHERE animal = 'cat'","SELECT name FROM pets WHERE animal = 'cat';"]}),
   T("Comparing signs, just like in maths class:\n`=` equal, `>` bigger, `<` smaller, `>=` bigger or equal, `<=` smaller or equal, `!=` not equal."),
   Q("What does this show?", ["Pets older than 5","Pets that are exactly 5","Only 5 pets"], 0, "Yes! > means 'bigger than'.", {code:"SELECT name FROM pets WHERE age > 5;"}),
   C("Show the **names** of pets **older than 4**.", "SELECT name FROM pets WHERE age > 4", {hints:["Use age > 4","SELECT name FROM pets WHERE age > 4;"]}),
   C("Show **all columns** for pets that weigh **less than 1** kg. Tiny pets!", "SELECT * FROM pets WHERE weight_kg < 1", {hints:["The column is weight_kg","SELECT * FROM pets WHERE weight_kg < 1;"]}),
   C("Show the **name** and **animal** of pets that are **not dogs**.", "SELECT name, animal FROM pets WHERE animal != 'dog'", {hints:["!= means not equal","SELECT name, animal FROM pets WHERE animal != 'dog';"]}),
  ]},
  {id:'w2b', title:'AND, OR, Brackets', steps:[
   T("**AND** means BOTH things must be true. `animal = 'cat' AND color = 'white'` gives only white cats."),
   C("Show **all columns** for **white cats**.", "SELECT * FROM pets WHERE animal = 'cat' AND color = 'white'", {hints:["Two tests joined by AND","SELECT * FROM pets WHERE animal = 'cat' AND color = 'white';"]}),
   T("**OR** means at least ONE is true. `animal = 'cat' OR animal = 'dog'` gives cats and dogs together."),
   Q("You order ice cream with chocolate AND sprinkles. What do you get?", ["Only chocolate","Chocolate and sprinkles, both","One of them, the shop picks"], 1, "Yes. AND = both. OR would be 'either one'."),
   C("Show the **name** and **animal** of all **cats and parrots**.", "SELECT name, animal FROM pets WHERE animal = 'cat' OR animal = 'parrot'", {hints:["animal = 'cat' OR animal = 'parrot'","SELECT name, animal FROM pets WHERE animal = 'cat' OR animal = 'parrot';"]}),
   C("Show the **names** of **dogs older than 2**.", "SELECT name FROM pets WHERE animal = 'dog' AND age > 2", {hints:["Both must be true, so AND","SELECT name FROM pets WHERE animal = 'dog' AND age > 2;"]}),
   T("Mixing AND with OR? Use **brackets**, just like in maths. The brackets get checked first:", {code:"WHERE (animal = 'cat' OR animal = 'dog') AND age < 3"}),
   C("Show the **names** of **cats or dogs** that are **younger than 3**.", "SELECT name FROM pets WHERE (animal = 'cat' OR animal = 'dog') AND age < 3", {hints:["Put the OR part inside ( )","SELECT name FROM pets WHERE (animal = 'cat' OR animal = 'dog') AND age < 3;"]}),
  ]},
 ]},
 {id:'w3', name:'Sorting Station', sub:'ORDER BY, LIMIT, DISTINCT, AS', color:'sun', lessons:[
  {id:'w3a', title:'Line Up! ORDER BY', steps:[
   T("**ORDER BY** lines rows up, like kids standing by height. **ASC** = small to big (that's the normal way). **DESC** = big to small.", {art:'sort'}),
   T("Lightest pets first:", {code:"SELECT name, weight_kg FROM pets ORDER BY weight_kg;"}),
   C("Show **name** and **weight_kg**, **heaviest first**.", "SELECT name, weight_kg FROM pets ORDER BY weight_kg DESC", {hints:["DESC means big to small","SELECT name, weight_kg FROM pets ORDER BY weight_kg DESC;"]}),
   C("Show owner **names** in **A to Z** order.", "SELECT name FROM owners ORDER BY name", {hints:["Text sorts A to Z with ASC","SELECT name FROM owners ORDER BY name;"]}),
   T("**LIMIT** chops the list. `LIMIT 3` keeps only the first 3 rows. Perfect for \"Top 3\" lists!"),
   C("Show the **3 heaviest** pets: **name** and **weight_kg**.", "SELECT name, weight_kg FROM pets ORDER BY weight_kg DESC LIMIT 3", {hints:["First sort heaviest first, then LIMIT 3","SELECT name, weight_kg FROM pets ORDER BY weight_kg DESC LIMIT 3;"]}),
   C("Which pet is the **lightest**? Show just its **name** (1 row).", "SELECT name FROM pets ORDER BY weight_kg LIMIT 1", {hints:["Sort lightest first, keep 1","SELECT name FROM pets ORDER BY weight_kg LIMIT 1;"]}),
   Q("Where does LIMIT go?", ["At the very end","Right after SELECT","Before FROM"], 0, "Yes. SELECT → FROM → WHERE → ORDER BY → LIMIT. That's the order of the spell."),
  ]},
  {id:'w3b', title:'DISTINCT and Nicknames', steps:[
   T("**DISTINCT** removes repeats. `SELECT DISTINCT animal FROM pets` shows each animal only once."),
   C("Show each **different color** of pets, only once each.", "SELECT DISTINCT color FROM pets", {hints:["SELECT DISTINCT column FROM table","SELECT DISTINCT color FROM pets;"]}),
   T("**AS** gives a column a nickname. You can even do maths:", {code:"SELECT name, weight_kg * 1000 AS grams FROM pets;"}),
   C("Show each pet's **name** and its weight in **grams** (`weight_kg * 1000`).", "SELECT name, weight_kg * 1000 AS grams FROM pets", {hints:["Multiply with *","SELECT name, weight_kg * 1000 AS grams FROM pets;"]}),
   C("Show each **different city** of owners, in **A to Z** order.", "SELECT DISTINCT city FROM owners ORDER BY city", {hints:["DISTINCT, then ORDER BY","SELECT DISTINCT city FROM owners ORDER BY city;"]}),
   Q("Pet ages in dog years! Which line is correct?", ["SELECT name, age * 7 AS dog_years FROM pets","SELECT name AS age * 7 FROM pets","SELECT dog_years FROM pets"], 0, "Yes! Do the maths first, then give it a nickname with AS."),
  ]},
 ]},
 {id:'w4', name:'Pattern Park', sub:'LIKE, IN, BETWEEN, NULL', color:'pink', lessons:[
  {id:'w4a', title:'LIKE: Find by Pattern', steps:[
   T("**LIKE** finds patterns in words. The `%` sign means \"anything can go here\".\n`'M%'` starts with M\n`'%o'` ends with o\n`'%oo%'` has oo inside"),
   C("Show the **names** of pets that **start with M**.", "SELECT name FROM pets WHERE name LIKE 'M%'", {hints:["name LIKE 'M%'","SELECT name FROM pets WHERE name LIKE 'M%';"]}),
   C("Show the **names** of pets that **end with o**.", "SELECT name FROM pets WHERE name LIKE '%o'", {hints:["Put the % before the o","SELECT name FROM pets WHERE name LIKE '%o';"]}),
   Q("What does `name LIKE '%a%'` find?", ["Names with an a anywhere","Names starting with a","Only the name 'a'"], 0, "Yes! % on both sides means 'anywhere in the middle'."),
  ]},
  {id:'w4b', title:'IN and BETWEEN', steps:[
   T("**IN** is a shortcut for lots of ORs:", {code:"WHERE animal IN ('cat', 'dog', 'fish')"}),
   C("Show **all columns** for pets that are a **cat, fish or rabbit**.", "SELECT * FROM pets WHERE animal IN ('cat','fish','rabbit')", {hints:["animal IN ('cat','fish','rabbit')","SELECT * FROM pets WHERE animal IN ('cat','fish','rabbit');"]}),
   T("**BETWEEN** picks a range, and includes both ends:", {code:"WHERE age BETWEEN 2 AND 4"}),
   C("Show **name** and **age** of pets aged **between 2 and 5**.", "SELECT name, age FROM pets WHERE age BETWEEN 2 AND 5", {hints:["age BETWEEN 2 AND 5","SELECT name, age FROM pets WHERE age BETWEEN 2 AND 5;"]}),
   C("Show **names** of owners who live in **Delhi or Mumbai** (use IN).", "SELECT name FROM owners WHERE city IN ('Delhi','Mumbai')", {hints:["city IN ('Delhi','Mumbai')","SELECT name FROM owners WHERE city IN ('Delhi','Mumbai');"]}),
  ]},
  {id:'w4c', title:'NULL: The Mystery Box', steps:[
   T("**NULL** means \"nobody knows\". It's an empty mystery box. Coco the rabbit is a stray, so her owner_id is NULL. 🐰", {art:'null'}),
   T("Funny rule: you can't use `= NULL`. Nothing equals a mystery! Use **IS NULL** or **IS NOT NULL**."),
   Q("Which finds pets with no owner?", ["WHERE owner_id = NULL","WHERE owner_id IS NULL","WHERE owner_id = 0"], 1, "Yes! IS NULL is the only way to catch an empty box."),
   C("Find **all columns** for pets with **no owner**.", "SELECT * FROM pets WHERE owner_id IS NULL", {hints:["owner_id IS NULL","SELECT * FROM pets WHERE owner_id IS NULL;"]}),
   C("Show **names** of pets that **do** have an owner.", "SELECT name FROM pets WHERE owner_id IS NOT NULL", {hints:["IS NOT NULL","SELECT name FROM pets WHERE owner_id IS NOT NULL;"]}),
  ]},
 ]},
 {id:'w5', name:'Counting Castle', sub:'COUNT, SUM, AVG, GROUP BY, HAVING', color:'orange', lessons:[
  {id:'w5a', title:'Calculator Spells', steps:[
   T("These are calculator spells. They squish many rows into ONE answer:\n`COUNT(*)` how many\n`SUM(x)` add up\n`AVG(x)` average\n`MIN(x)` smallest\n`MAX(x)` biggest"),
   T("How many pets live in Pet Town?", {code:"SELECT COUNT(*) FROM pets;"}),
   C("How many **dogs** are there?", "SELECT COUNT(*) FROM pets WHERE animal = 'dog'", {hints:["COUNT(*) with a WHERE filter","SELECT COUNT(*) FROM pets WHERE animal = 'dog';"]}),
   C("What is the **total weight** of all pets? (use SUM)", "SELECT SUM(weight_kg) FROM pets", {hints:["SUM(weight_kg)","SELECT SUM(weight_kg) FROM pets;"]}),
   C("What is the **average age** of **cats**?", "SELECT AVG(age) FROM pets WHERE animal = 'cat'", {hints:["AVG(age) and WHERE","SELECT AVG(age) FROM pets WHERE animal = 'cat';"]}),
   C("In one query, show the **oldest age** and the **youngest age** (MAX and MIN).", "SELECT MAX(age), MIN(age) FROM pets", {hints:["Two spells with a comma between","SELECT MAX(age), MIN(age) FROM pets;"]}),
   Q("How many fish are there? Look at the pets table in your head!", ["0","1","12"], 1, "Yes! Only Bubbles. 🐠"),
  ]},
  {id:'w5b', title:'GROUP BY: Candy Buckets', steps:[
   T("**GROUP BY** puts rows into buckets, then counts each bucket. Like sorting candies by color and counting each pile!", {art:'buckets'}),
   T("Count the pets of each animal:", {code:"SELECT animal, COUNT(*) FROM pets GROUP BY animal;"}),
   C("Count **how many pets** of **each animal** there are. Show animal and count.", "SELECT animal, COUNT(*) FROM pets GROUP BY animal", {hints:["GROUP BY animal","SELECT animal, COUNT(*) FROM pets GROUP BY animal;"]}),
   C("Show **each color** and **how many** pets have it.", "SELECT color, COUNT(*) FROM pets GROUP BY color", {hints:["Same idea, bucket by color","SELECT color, COUNT(*) FROM pets GROUP BY color;"]}),
   C("For **each animal**, show the **average weight**.", "SELECT animal, AVG(weight_kg) FROM pets GROUP BY animal", {hints:["AVG(weight_kg) with GROUP BY animal","SELECT animal, AVG(weight_kg) FROM pets GROUP BY animal;"]}),
   T("**HAVING** is a filter for buckets. WHERE checks rows *before* grouping. HAVING checks the buckets *after* grouping.", {code:"SELECT animal, COUNT(*) FROM pets\nGROUP BY animal\nHAVING COUNT(*) > 2;"}),
   C("Show the **animals** that have **more than 2 pets**, with their count.", "SELECT animal, COUNT(*) FROM pets GROUP BY animal HAVING COUNT(*) > 2", {hints:["HAVING COUNT(*) > 2 goes after GROUP BY","SELECT animal, COUNT(*) FROM pets GROUP BY animal HAVING COUNT(*) > 2;"]}),
   Q("You want buckets with more than 2 pets. Which word filters buckets?", ["WHERE","HAVING","LIMIT"], 1, "Yes. HAVING is for groups."),
  ]},
 ]},
 {id:'w6', name:'Join Junction', sub:'JOIN and LEFT JOIN', color:'grape', lessons:[
  {id:'w6a', title:'Tables Holding Hands', steps:[
   T("Pets know their **owner_id**, but not the owner's **name**. To get both, we **JOIN** the tables. They hold hands where `pets.owner_id = owners.id`.", {art:'join'}),
   T("Here's the spell:", {code:"SELECT pets.name, owners.name\nFROM pets\nJOIN owners ON pets.owner_id = owners.id;"}),
   C("Show each **pet's name** and its **owner's name**.", "SELECT pets.name, owners.name FROM pets JOIN owners ON pets.owner_id = owners.id", {hints:["JOIN owners ON pets.owner_id = owners.id","SELECT pets.name, owners.name FROM pets JOIN owners ON pets.owner_id = owners.id;"]}),
   T("Typing long table names is tiring. Give them short nicknames: `FROM pets p JOIN owners o`. Then write `p.name` and `o.name`."),
   C("Show the **names of pets** whose owner lives in **Ranchi**.", "SELECT p.name FROM pets p JOIN owners o ON p.owner_id = o.id WHERE o.city = 'Ranchi'", {hints:["JOIN first, then WHERE o.city = 'Ranchi'","SELECT p.name FROM pets p JOIN owners o ON p.owner_id = o.id WHERE o.city = 'Ranchi';"]}),
   C("Show each **owner's name** and their **pet's name**, but only for **dogs**.", "SELECT o.name, p.name FROM pets p JOIN owners o ON p.owner_id = o.id WHERE p.animal = 'dog'", {hints:["JOIN, then WHERE p.animal = 'dog'","SELECT o.name, p.name FROM pets p JOIN owners o ON p.owner_id = o.id WHERE p.animal = 'dog';"]}),
   Q("Coco has no owner (NULL). Does Coco show up in a normal JOIN with owners?", ["Yes","No"], 1, "Right. A normal JOIN only keeps rows that found a hand to hold."),
  ]},
  {id:'w6b', title:'LEFT JOIN: Nobody Left Behind', steps:[
   T("**LEFT JOIN** keeps EVERY row from the left table, even without a partner. Missing partners show up as NULL."),
   C("Show every **owner's name** and their **pet's name**, including owners with **no pets**.", "SELECT o.name, p.name FROM owners o LEFT JOIN pets p ON p.owner_id = o.id", {hints:["Start FROM owners, then LEFT JOIN pets","SELECT o.name, p.name FROM owners o LEFT JOIN pets p ON p.owner_id = o.id;"]}),
   C("Find the **names** of owners who have **no pets at all**.", "SELECT o.name FROM owners o LEFT JOIN pets p ON p.owner_id = o.id WHERE p.id IS NULL", {hints:["LEFT JOIN, then keep rows where the pet is NULL","SELECT o.name FROM owners o LEFT JOIN pets p ON p.owner_id = o.id WHERE p.id IS NULL;"]}),
   T("The **snacks** table lists treats each pet ate. It has **pet_id**. Let's join pets with snacks!", {show:'snacks'}),
   C("Show each **pet name** with the **snack** it ate.", "SELECT p.name, s.snack FROM pets p JOIN snacks s ON s.pet_id = p.id", {hints:["JOIN snacks s ON s.pet_id = p.id","SELECT p.name, s.snack FROM pets p JOIN snacks s ON s.pet_id = p.id;"]}),
   C("Show the **total snack money** spent on each pet: **pet name** and `SUM(qty * price)`.", "SELECT p.name, SUM(s.qty * s.price) FROM pets p JOIN snacks s ON s.pet_id = p.id GROUP BY p.name", {hints:["JOIN, then GROUP BY p.name","SELECT p.name, SUM(s.qty * s.price) FROM pets p JOIN snacks s ON s.pet_id = p.id GROUP BY p.name;"]}),
  ]},
 ]},
 {id:'w7', name:"Builder's Workshop", sub:'INSERT, UPDATE, DELETE, CREATE', color:'sky', lessons:[
  {id:'w7a', title:'INSERT: Add a New Friend', steps:[
   T("Until now we only ASKED questions. Now we CHANGE data! **INSERT INTO** adds a new row:", {code:"INSERT INTO pets (id, name, animal, age, color, weight_kg, owner_id)\nVALUES (13, 'Golu', 'dog', 1, 'brown', 6, 7);"}),
   C("A new kitten! Add a pet: id **13**, name **'Kiwi'**, animal **'cat'**, age **1**, color **'grey'**, weight_kg **2**, owner_id **7**.", "INSERT INTO pets (id, name, animal, age, color, weight_kg, owner_id) VALUES (13, 'Kiwi', 'cat', 1, 'grey', 2, 7)", {check:"SELECT * FROM pets WHERE id = 13", hints:["Copy the example and change the values","INSERT INTO pets (id, name, animal, age, color, weight_kg, owner_id) VALUES (13, 'Kiwi', 'cat', 1, 'grey', 2, 7);"]}),
   C("Add a new owner: id **8**, name **'Tara'**, city **'Goa'**, age **28**.", "INSERT INTO owners (id, name, city, age) VALUES (8, 'Tara', 'Goa', 28)", {check:"SELECT * FROM owners WHERE id = 8", hints:["INSERT INTO owners (id, name, city, age) VALUES (...)","INSERT INTO owners (id, name, city, age) VALUES (8, 'Tara', 'Goa', 28);"]}),
  ]},
  {id:'w7b', title:'UPDATE and DELETE', steps:[
   T("**UPDATE** changes values. ALWAYS use WHERE, or you change EVERY row! 😱", {code:"UPDATE pets SET color = 'pink' WHERE name = 'Momo';"}),
   Q("What happens with `UPDATE pets SET age = 1` with no WHERE?", ["Only one pet changes","Every pet becomes 1 year old","Nothing happens"], 1, "Yes! Every single pet would become a baby. WHERE is your seatbelt."),
   C("Momo had a birthday! 🎂 Set **Momo's age to 4**.", "UPDATE pets SET age = 4 WHERE name = 'Momo'", {check:"SELECT id, name, age FROM pets ORDER BY id", hints:["UPDATE pets SET age = 4 WHERE ...","UPDATE pets SET age = 4 WHERE name = 'Momo';"]}),
   C("The parrots painted themselves! Make every **parrot's color 'rainbow'**.", "UPDATE pets SET color = 'rainbow' WHERE animal = 'parrot'", {check:"SELECT id, name, color FROM pets ORDER BY id", hints:["WHERE animal = 'parrot'","UPDATE pets SET color = 'rainbow' WHERE animal = 'parrot';"]}),
   T("**DELETE** removes rows. WHERE is your seatbelt again!", {code:"DELETE FROM pets WHERE name = 'Rocky';"}),
   C("Bubbles the fish swam off to the ocean. 🌊 **Delete Bubbles**.", "DELETE FROM pets WHERE name = 'Bubbles'", {check:"SELECT id, name FROM pets ORDER BY id", hints:["DELETE FROM pets WHERE ...","DELETE FROM pets WHERE name = 'Bubbles';"]}),
  ]},
  {id:'w7c', title:'CREATE TABLE: Build Your Own', steps:[
   T("**CREATE TABLE** makes a brand-new table. You choose the column names and their types:\n`INTEGER` whole numbers\n`TEXT` words\n`REAL` decimals", {code:"CREATE TABLE games (id INTEGER, title TEXT, rating REAL);"}),
   C("Create a table **toys** with columns **id INTEGER**, **name TEXT**, **price REAL**. Then insert one toy: **1, 'Yo-yo', 50**. (Two spells, each ending with ;)", "CREATE TABLE toys (id INTEGER, name TEXT, price REAL); INSERT INTO toys VALUES (1, 'Yo-yo', 50)", {check:"SELECT * FROM toys", hints:["First CREATE TABLE toys (...); then INSERT INTO toys VALUES (...);","CREATE TABLE toys (id INTEGER, name TEXT, price REAL);\nINSERT INTO toys VALUES (1, 'Yo-yo', 50);"]}),
   Q("Which type would you use for a pet's name?", ["INTEGER","TEXT","REAL"], 1, "Yes! Words are TEXT."),
  ]},
 ]},
 {id:'w8', name:'Wizard Tower', sub:'CASE, subqueries, WITH, window functions', color:'mint', lessons:[
  {id:'w8a', title:'CASE: If This, Then That', steps:[
   T("**CASE** lets SQL make decisions, like an if-else:", {code:"SELECT name,\n  CASE WHEN weight_kg > 10 THEN 'big' ELSE 'small' END AS size\nFROM pets;"}),
   C("Show each pet's **name** and a **size**: **'big'** if weight_kg > 5, else **'small'**.", "SELECT name, CASE WHEN weight_kg > 5 THEN 'big' ELSE 'small' END AS size FROM pets", {hints:["CASE WHEN weight_kg > 5 THEN 'big' ELSE 'small' END","SELECT name, CASE WHEN weight_kg > 5 THEN 'big' ELSE 'small' END AS size FROM pets;"]}),
   C("Label ages: **'baby'** if age < 2, **'adult'** if age < 10, else **'grandpa'**. Show **name** and the label.", "SELECT name, CASE WHEN age < 2 THEN 'baby' WHEN age < 10 THEN 'adult' ELSE 'grandpa' END FROM pets", {hints:["You can have many WHENs in one CASE","SELECT name, CASE WHEN age < 2 THEN 'baby' WHEN age < 10 THEN 'adult' ELSE 'grandpa' END AS label FROM pets;"]}),
  ]},
  {id:'w8b', title:'Subqueries: Question Inside a Question', steps:[
   T("A **subquery** is a question inside a question, like a little doll inside a bigger doll. The inner one runs first:", {code:"SELECT name FROM pets\nWHERE weight_kg > (SELECT AVG(weight_kg) FROM pets);"}),
   C("Show the **names** of pets **heavier than the average** weight.", "SELECT name FROM pets WHERE weight_kg > (SELECT AVG(weight_kg) FROM pets)", {hints:["Put SELECT AVG(weight_kg) FROM pets inside ( )","SELECT name FROM pets WHERE weight_kg > (SELECT AVG(weight_kg) FROM pets);"]}),
   C("Show **names** of pets whose owner lives in **Delhi**, using **IN** with a subquery (no JOIN!).", "SELECT name FROM pets WHERE owner_id IN (SELECT id FROM owners WHERE city = 'Delhi')", {hints:["owner_id IN (SELECT id FROM owners WHERE ...)","SELECT name FROM pets WHERE owner_id IN (SELECT id FROM owners WHERE city = 'Delhi');"]}),
   C("Find the **name** of the **oldest pet** using a subquery with MAX.", "SELECT name FROM pets WHERE age = (SELECT MAX(age) FROM pets)", {hints:["WHERE age = (SELECT MAX(age) FROM pets)","SELECT name FROM pets WHERE age = (SELECT MAX(age) FROM pets);"]}),
  ]},
  {id:'w8c', title:'WITH and Window Magic', steps:[
   T("**WITH** gives a query a name, so you can use it like a table. Neat and tidy!", {code:"WITH old_pets AS (\n  SELECT * FROM pets WHERE age > 5\n)\nSELECT name FROM old_pets;"}),
   C("Using **WITH**, make **big_pets** (weight_kg > 5), then select their **names**.", "WITH big_pets AS (SELECT * FROM pets WHERE weight_kg > 5) SELECT name FROM big_pets", {hints:["WITH big_pets AS ( ... ) SELECT name FROM big_pets","WITH big_pets AS (SELECT * FROM pets WHERE weight_kg > 5) SELECT name FROM big_pets;"]}),
   T("**Window functions** look at the neighbors without squishing rows. `RANK() OVER (ORDER BY weight_kg DESC)` gives each pet a race position!", {code:"SELECT name, RANK() OVER (ORDER BY age DESC) AS place\nFROM pets;"}),
   C("Show **name**, **weight_kg**, and the **rank by weight** (heaviest = 1).", "SELECT name, weight_kg, RANK() OVER (ORDER BY weight_kg DESC) FROM pets", {hints:["RANK() OVER (ORDER BY weight_kg DESC)","SELECT name, weight_kg, RANK() OVER (ORDER BY weight_kg DESC) AS r FROM pets;"]}),
   T("**PARTITION BY** makes a separate race in each bucket: `RANK() OVER (PARTITION BY animal ORDER BY weight_kg DESC)` ranks cats among cats and dogs among dogs."),
   C("For **each animal**, rank the pets by weight (heaviest = 1). Show **animal**, **name**, and the **rank**.", "SELECT animal, name, RANK() OVER (PARTITION BY animal ORDER BY weight_kg DESC) FROM pets", {hints:["OVER (PARTITION BY animal ORDER BY weight_kg DESC)","SELECT animal, name, RANK() OVER (PARTITION BY animal ORDER BY weight_kg DESC) AS r FROM pets;"]}),

/* =====================================================================
   SQL ENGINE
   ===================================================================== */
let SQL = null;
const sqlReady = (typeof initSqlJs === 'function' ? initSqlJs({}) : Promise.reject('no sql')).then(s => (SQL = s)).catch(() => null);
function freshDB(ds){ const db = new SQL.Database(); db.exec(DATASETS[ds] || DATASETS.pets); return db; }
function runSQL(sql, ds, check){
  if (!SQL) return {ok:false, err:'The SQL engine is still waking up. Try again in a second!'};
  const db = freshDB(ds);
  try {
    let res = db.exec(sql);
    if (check) res = db.exec(check);
    const last = [...res].reverse().find(r => r.columns && r.columns.length) || null;
    return {ok:true, res:last, changes:db.getRowsModified()};
  } catch(e) { return {ok:false, err:String(e && e.message || e)}; }
  finally { db.close(); }
}
const solCache = new Map();
function solution(task, ds){
  const k = ds + '|' + task.sol + '|' + (task.check||'');
  if (!solCache.has(k)) solCache.set(k, runSQL(task.sol, ds, task.check));
  return solCache.get(k);
}
function isOrdered(sql){ return /order\s+by/i.test(String(sql).replace(/over\s*\([^)]*\)/gi, '')); }
function norm(v){ if (v === null || v === undefined) return 'NULL'; if (typeof v === 'number') return String(Math.round(v*1000)/1000); return String(v).trim(); }
function compare(u, s, ordered){
  if (!s) return {ok:!u || !u.values.length};
  if (!u) return {ok:false, why:"Your spell didn't show any table. Did you forget SELECT?"};
  if (u.columns.length !== s.columns.length)
    return {ok:false, why:`Byte wanted **${s.columns.length}** column${s.columns.length>1?'s':''}, but you showed **${u.columns.length}**. Check the list after SELECT.`};
  if (u.values.length !== s.values.length)
    return {ok:false, why:`You got **${u.values.length}** row${u.values.length===1?'':'s'}, but Byte wanted **${s.values.length}**. Check your WHERE filter${s.values.length<u.values.length?' (too many rows got through)':''}.`};
  // match columns by their values, so "age, name" also works for "name, age"
  const sig = (res, c) => res.values.map(r => norm(r[c])).sort().join('␟');
  const sSig = s.columns.map((_, c) => sig(s, c)), used = new Set(), map = [];
  for (let c = 0; c < u.columns.length; c++) {
    const us = sig(u, c); let found = -1;
    for (let j = 0; j < sSig.length; j++) if (!used.has(j) && sSig[j] === us) { found = j; break; }
    if (found < 0) return {ok:false, why:"Right number of rows, but some values are different. Look closely at the target table!"};
    used.add(found); map[found] = c;
  }
  const row = (r, mp) => (mp ? mp.map(c => norm(r[c])) : r.map(norm)).join('␟');
  const A = u.values.map(r => row(r, map)), Bv = s.values.map(r => row(r));
  if (ordered) {
    if (A.every((x, i) => x === Bv[i])) return {ok:true};
    const as = [...A].sort(), bs = [...Bv].sort();
    if (as.every((x, i) => x === bs[i])) return {ok:false, why:"Right rows, wrong order! Check your **ORDER BY** (ASC or DESC?)."};
    return {ok:false, why:"Some rows are different from what Byte wanted."};
  }
  const as = [...A].sort(), bs = [...Bv].sort();
  return as.every((x, i) => x === bs[i]) ? {ok:true} : {ok:false, why:"Right size, but some rows don't match. Check your filter!"};
}
function tablesOf(ds){
  if (!SQL) return [];
  const db = freshDB(ds);
  try {
    const t = db.exec("SELECT name FROM sqlite_master WHERE type='table' ORDER BY rowid");
    return t.length ? t[0].values.map(([n]) => ({name:n, cols:db.exec(`PRAGMA table_info(${n})`)[0].values.map(r => r[1])})) : [];
  } finally { db.close(); }
}
function friendly(err, ds){
  const tbls = tablesOf(ds);
  let m;
  if ((m = err.match(/no such column: ([\w.]+)/i))) {
    return `Byte can't find a column called **${m[1]}**. Check the spelling! Columns you can use: ${tbls.map(t => t.name + ' (' + t.cols.join(', ') + ')').join('; ')}.`;
  }
  if ((m = err.match(/no such table: (\w+)/i))) return `There's no table called **${m[1]}**. The tables here are: **${tbls.map(t=>t.name).join(', ')}**.`;
  if ((m = err.match(/near "([^"]*)": syntax error/i))) return `Byte got confused near **${m[1]}**. Maybe a typo, a missing comma, or a missing quote ' around a word?`;
  if (/incomplete input/i.test(err)) return "Your spell stopped too early. Is a quote ' or a bracket ( left open?";
  if (/ambiguous column name: ([\w]+)/i.test(err)) return `Two tables both have **${err.match(/ambiguous column name: ([\w]+)/i)[1]}**. Say which one, like **p.name** or **o.name**.`;
  if (/UNIQUE constraint/i.test(err)) return "That id is already taken! Every id must be unique. Pick a new number.";
  if (/misuse of aggregate/i.test(err)) return "Calculator spells like COUNT or SUM can't go in WHERE. Use HAVING for groups!";
  if (/table \w+ already exists/i.test(err)) return "That table already exists! Pick a new name.";
  return "Byte saw an error: " + err;
}

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(s){ return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<i>$1</i>').replace(/\n/g, '<br>'); }
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const COLORVAR = {grape:'var(--grape)', sky:'var(--sky)', mint:'var(--mint)', sun:'var(--sun)', pink:'var(--pink)', orange:'var(--orange)'};
const KW = new Set('SELECT FROM WHERE AND OR NOT ORDER BY ASC DESC LIMIT DISTINCT AS LIKE IN BETWEEN IS NULL COUNT SUM AVG MIN MAX GROUP HAVING JOIN LEFT INNER OUTER ON INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE INTEGER TEXT REAL CASE WHEN THEN ELSE END WITH OVER PARTITION RANK DENSE_RANK ROW_NUMBER UNION ALL EXISTS ROUND DROP PRIMARY KEY JULIANDAY'.split(' '));
function hl(src, idents){
  let out = ''; const re = /('(?:[^']|'')*'?)|(\b\d+(?:\.\d+)?\b)|(--[^\n]*)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g; let m;
  while ((m = re.exec(src))) {
    if (m[1]) out += `<span class="t-str">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="t-num">${m[2]}</span>`;
    else if (m[3]) out += `<span class="t-com">${esc(m[3])}</span>`;
    else if (m[4]) out += KW.has(m[4].toUpperCase()) ? `<span class="t-kw">${m[4]}</span>` : (idents && idents.has(m[4].toLowerCase()) ? `<span class="t-id">${m[4]}</span>` : esc(m[4]));
    else out += esc(m[5]);
  }
  return out;
}
function tableHTML(res, max=8, cap=''){
  if (!res) return `<div class="msg info">No table to show. (That's normal for INSERT, UPDATE and DELETE.)</div>`;
  const rows = res.values.slice(0, max);
  return `${cap ? `<div class="tbl-cap"><span>${cap}</span><span class="muted">${res.values.length} row${res.values.length===1?'':'s'}</span></div>` : ''}
  <div class="tbl-wrap"><table class="data"><thead><tr>${res.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
  <tbody>${rows.map((r, i) => `<tr style="animation-delay:${i*40}ms">${r.map(v => v === null ? '<td class="null">NULL</td>' : `<td>${esc(typeof v === 'number' ? Math.round(v*1000)/1000 : v)}</td>`).join('')}</tr>`).join('')}</tbody></table>
  ${res.values.length > max ? `<div class="more">+ ${res.values.length - max} more rows</div>` : ''}</div>`;
}
function showTable(ds, name){ const r = runSQL('SELECT * FROM ' + name, ds); return r.ok ? tableHTML(r.res, 20, `<code>${esc(name)}</code> table`) : ''; }

function gainXP(n, fromEl){
  if (!n) return;
  const t = today(), before = S.days[t] || 0, lv0 = levelOf(S.xp);
  S.xp += n; S.days[t] = before + n;
  floater('+' + n + ' XP', fromEl);
  const g = S.settings.goal;
  if (before < g && S.days[t] >= g && !S.goalMet[t]) {
    S.goalMet[t] = true; addCoins(15, null, true);
    setTimeout(() => { sfx.win(); confetti(); toast(ICON.star(26) + ` Daily goal reached! +15 coins`); }, 600);
  }
  S.bestStreak = Math.max(S.bestStreak, streak());
  const lv1 = levelOf(S.xp);
  if (lv1 > lv0) setTimeout(() => levelUp(lv1), 900);
  save(); renderStats(); checkBadges();
}
function addCoins(n, fromEl, quiet){
  S.coins += n; save();
  if (fromEl) coinFly(fromEl);
  setTimeout(() => { renderStats(); const p = $('#pillCoins'); if (p) { p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); } if (!quiet) sfx.coin(); }, fromEl ? 800 : 0);
}

      g.gain.setValueAtTime(vol, t0 + i*dur); g.gain.exponentialRampToValueAtTime(0.0001, t0 + i*dur + dur*1.8);

}

function confetti(x = innerWidth/2, y = innerHeight/3, n = 120){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) n = 24;
  const cols = ['#FF5C8A','#FFC83A','#20C996','#3FA9F5','#8B6CFF','#FF8A3D'];
  for (let i = 0; i < n; i++) parts.push({x, y, vx:(Math.random()-.5)*16, vy:Math.random()*-15-3, r:Math.random()*7+4, c:pick(cols), a:Math.random()*6, va:(Math.random()-.5)*.4, life:150, shape:Math.random()<.5});

function tick(){

    ctx.save(); ctx.translate(p.x*d, p.y*d); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.min(1, p.life/40);

  nodes.forEach(([n]) => n.textContent = '');

    const [n, t] = nodes[ni]; n.textContent = t.slice(0, ++ci); if (ci >= t.length) { ni++; ci = 0; } } setTimeout(step, 16); })();

        ${[...new Set(tbls.filter(t => (task.tables || [task.mainTable || tbls[0]?.name]).some(x => x === t.name) || tbls.length <= 3).flatMap(t => t.cols))].slice(0, 14).map(c => `<button class="chip cl" data-ins="${c}">${c}</button>`).join('')}</div>
      <div class="row"><button class="btn go" data-run>▶ ${mode === 'arena' ? 'Submit' : 'Run & check'}</button>
        <button class="btn small" data-tryrun>Just run</button>
        ${hints.length || canReveal ? `<button class="btn small sun" data-hint>💡 Hint</button>` : ''}
        <button class="btn small" data-peek>👀 Peek at tables</button>

  if (name === 'detective') return `<div class="art det"><div><b>FROM</b>1. Where is the info? Which table?</div><div><b>SELECT</b>2. What do I want to see?</div><div><b>WHERE</b>3. Which ones? Any filter?</div><div><b>ORDER BY</b>4. What order?</div></div>`;
  if (name === 'null') return `<div class="art"><div class="boxq">?</div><div class="muted" style="text-align:center;font-weight:800;font-size:.85rem">NULL = empty mystery box</div></div>`;
  if (name === 'grow') { const pl = s => `<svg width="${s}" height="${s}" viewBox="0 0 40 40"><path d="M20 40 V18" stroke="#16B47F" stroke-width="4"/><path d="M20 22 Q6 20 6 8 Q18 8 20 22Z M20 18 Q34 16 34 4 Q22 4 20 18Z" fill="#20C996" stroke="#1C2448" stroke-width="2"/></svg>`;
    return `<div class="art"><div class="sprouts"><div style="animation-delay:0s">${pl(30)}Try</div><div>${pl(46).replace('<svg', '<svg style="animation-delay:1s"')}Oops!</div><div>${pl(62).replace('<svg', '<svg style="animation-delay:2s"')}Try again</div><div>${pl(84).replace('<svg', '<svg style="animation-delay:3s"')}Got it!</div></div></div>`; }
  if (name === 'tiny') return `<div class="art"><div class="steps-art">${[1,2,3,4,5,6].map(k => `<i style="height:${k*16}px;animation-delay:${k*.5}s"></i>`).join('')}</div><div class="muted" style="text-align:center;font-weight:800;font-size:.85rem;margin-top:6px">One small step at a time</div></div>`;
  if (name === 'flames') return `<div class="art"><div class="flames">${['M','T','W','T','F','S','S'].map((d, k) => `<div>${ICON.flame(26).replace('<svg', `<svg style="animation-delay:${k*.5}s"`)}${d}</div>`).join('')}</div></div>`;
  return '';
}

/* ---------- ARENA ---------- */
function renderArena(){
  const solvedN = ARENA.filter(a => S.arena[a.id]).length;
  const group = lvl => ARENA.filter(a => a.lvl === lvl).map(a => {
    const lock = !S.settings.unlockAll && !S.done[a.need];
    return `<button class="pcard card ${lock?'locked':''}" data-ar="${a.id}" ${lock?'aria-disabled="true"':''}>
     <div class="row" style="justify-content:space-between"><span class="tag ${a.lvl}">${a.lvl}</span>${S.arena[a.id] ? `<span class="solved">✓ Solved</span>` : lock ? `<span class="muted">${ICON.lock(18)}</span>` : ''}</div>
     <h3>${esc(a.title)}</h3><div class="muted" style="font-weight:700;font-size:.92rem">${lock ? `Unlocks after “${esc(NODE[a.need].title)}”` : md(a.q)}</div>
     <div class="muted" style="font-size:.8rem;font-weight:800">${a.lvl === 'easy' ? '+10' : a.lvl === 'medium' ? '+20' : '+30'} coins</div></button>`;
  }).join('');
  view.innerHTML = `<div class="eyebrow">Practice arena</div><h1 class="h-page">SQL Arena</h1>
   <p class="lead">Coding-test puzzles, the kind real programmers practice on HackerRank and LeetCode. You've solved ${solvedN} of ${ARENA.length}.</p>
   <h2 class="section-h">Easy</h2><div class="grid">${group('easy')}</div>
   <h2 class="section-h">Medium</h2><div class="grid">${group('medium')}</div>
   <h2 class="section-h">Hard</h2><div class="grid">${group('hard')}</div>`;
  $$('[data-ar]', view).forEach(b => b.onclick = () => {
    const a = ARENA.find(x => x.id === b.dataset.ar);
    if (!S.settings.unlockAll && !S.done[a.need]) { sfx.bad(); toast(ICON.lock(20) + ` Finish “${esc(NODE[a.need].title)}” first`); return; }
    sfx.click(); arenaProblem(a);
  });
}
function arenaProblem(a){
  view.className = 'wrap view-in';
  view.innerHTML = `<div class="row" style="margin-bottom:12px"><button class="btn small" id="arBack">← All problems</button><span class="tag ${a.lvl}">${a.lvl}</span>${S.arena[a.id] ? '<span class="solved">✓ Solved before</span>' : ''}</div>
   <div class="card" style="padding:20px"><h1 style="font-size:1.8rem;margin-bottom:6px">${esc(a.title)}</h1>
   <details style="margin-bottom:12px"><summary style="cursor:pointer;font-weight:900">Tables used: ${a.tables.join(', ')}</summary><div style="display:grid;gap:12px;margin-top:10px">${a.tables.map(t => showTable('arena', t)).join('')}</div></details>
   <div id="arTask"></div></div>`;
  $('#arBack').onclick = () => go('arena');
  codeTask($('#arTask'), a, {ds:'arena', mode:'arena', canReveal:false, onSolve:({el}) => {
    if (!S.arena[a.id]) { S.arena[a.id] = today(); const c = a.lvl === 'easy' ? 10 : a.lvl === 'medium' ? 20 : 30; gainXP(c, el); addCoins(c, el); }
    checkBadges();
  }});
}

/* ---------- PROJECTS ---------- */
const PROJ_ART = {
  pizza:`<svg viewBox="0 0 120 100" width="120" height="100"><circle cx="60" cy="52" r="40" fill="#FFC83A" stroke="#1C2448" stroke-width="4"/><circle cx="60" cy="52" r="32" fill="#FF8A3D"/><circle cx="48" cy="40" r="6" fill="#F2584A" stroke="#1C2448" stroke-width="2"/><circle cx="72" cy="46" r="6" fill="#F2584A" stroke="#1C2448" stroke-width="2"/><circle cx="56" cy="66" r="6" fill="#F2584A" stroke="#1C2448" stroke-width="2"/><path d="M76 62l6 4M42 54l-4 6" stroke="#20C996" stroke-width="4" stroke-linecap="round"/></svg>`,
  book:`<svg viewBox="0 0 120 100" width="120" height="100"><path d="M14 20 Q38 10 60 22 Q82 10 106 20 V84 Q82 74 60 86 Q38 74 14 84Z" fill="#fff" stroke="#1C2448" stroke-width="4" stroke-linejoin="round"/><path d="M60 22V86" stroke="#1C2448" stroke-width="3"/><path d="M24 34h26M24 44h26M24 54h20M70 34h26M70 44h26M70 54h18" stroke="#3FA9F5" stroke-width="4" stroke-linecap="round"/></svg>`,
  cookie:`<svg viewBox="0 0 120 100" width="120" height="100"><circle cx="54" cy="52" r="36" fill="#E8A65A" stroke="#1C2448" stroke-width="4"/><circle cx="42" cy="40" r="5" fill="#5B3A1E"/><circle cx="64" cy="36" r="4" fill="#5B3A1E"/><circle cx="58" cy="60" r="5" fill="#5B3A1E"/><circle cx="38" cy="62" r="4" fill="#5B3A1E"/><circle cx="92" cy="30" r="14" fill="none" stroke="#1C2448" stroke-width="5"/><path d="M102 40l12 12" stroke="#1C2448" stroke-width="6" stroke-linecap="round"/></svg>`,
  trophy:`<svg viewBox="0 0 120 100" width="120" height="100"><path d="M36 12h48v22a24 24 0 0 1-48 0z" fill="#FFC83A" stroke="#1C2448" stroke-width="4"/><path d="M36 20H22q0 18 16 20M84 20h14q0 18-16 20" fill="none" stroke="#1C2448" stroke-width="4"/><path d="M54 58h12v12H54z M42 70h36v14H42z" fill="#FFC83A" stroke="#1C2448" stroke-width="4"/><path d="M60 22l3 6 6 1-4 4 1 6-6-3-6 3 1-6-4-4 6-1z" fill="#fff"/></svg>`,
};
function renderProjects(){
  const open = S.settings.unlockAll || !!S.done.boss4;
  view.innerHTML = `<div class="eyebrow">Real-life missions</div><h1 class="h-page">Real-Life Projects</h1>
   <p class="lead">${open ? 'Real jobs use SQL like this every day. Pick a mission!' : `These unlock after you beat the final boss, the Mega Bug. You've finished ${Object.keys(S.done).filter(k => PATH.some(n => n.id === k)).length} of ${PATH.length} map stops.`}</p>
   <div class="grid">${PROJECTS.map(p => `<button class="pcard card ${open?'':'locked'}" data-pj="${p.id}">
     <div class="proj-art" style="background:${COLORVAR[p.color]}">${PROJ_ART[p.art]}</div>
     <div class="row" style="justify-content:space-between"><h3>${esc(p.title)}</h3>${S.done[p.id] ? '<span class="solved">✓ Done</span>' : open ? '' : `<span class="muted">${ICON.lock(18)}</span>`}</div>
     <div class="muted" style="font-weight:700">${esc(p.blurb)}</div><div class="muted" style="font-size:.82rem;font-weight:800">${p.steps.filter(s => s.t === 'code').length} tasks · ${esc(DS_NAMES[p.db])} database</div></button>`).join('')}</div>`;
  $$('[data-pj]', view).forEach(b => b.onclick = () => { if (!open) { sfx.bad(); toast(ICON.lock(20) + ' Beat the Mega Bug to unlock projects!'); return; } sfx.click(); startNode(NODE[b.dataset.pj]); });
}

/* ---------- PLAYGROUND ---------- */
function renderPlay(){
  const ds = view.dataset.ds || 'pets';
  view.innerHTML = `<div class="eyebrow">Free play</div><h1 class="h-page">Playground</h1>
   <p class="lead">Try any SQL you like. Nothing can break here: every run starts with fresh data.</p>
   <div class="row" style="margin-bottom:14px">${Object.keys(DATASETS).map(k => `<button class="btn small ${k===ds?'sun':''}" data-ds="${k}">${esc(DS_NAMES[k].split(' (')[0])}</button>`).join('')}</div>
   <div class="card" style="padding:18px" id="playBox"></div>`;
  $$('[data-ds]', view).forEach(b => b.onclick = () => { view.dataset.ds = b.dataset.ds; renderPlay(); });
  const host = $('#playBox');
  const tbls = tablesOf(ds);
  codeTask(host, {q:`Tables here: ${tbls.map(t => '`' + t.name + '`').join(', ')}. Press **Just run** to see what your spell does.`, sol:`SELECT * FROM ${tbls[0]?.name || 'pets'}`, tables:tbls.map(t => t.name)}, {ds, canReveal:false, startText:`SELECT * FROM ${tbls[0]?.name || 'pets'};`});
  // the playground has no target to match
  const target = host.querySelector('.task-grid .col:last-child .card'); if (target) target.remove();
  const run = host.querySelector('[data-run]'); if (run) run.remove();
  const tr = host.querySelector('[data-tryrun]'); if (tr) { tr.className = 'btn go'; tr.textContent = '▶ Run'; }
  const ta = host.querySelector('textarea'); ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.stopImmediatePropagation(); tr.click(); } }, true);
  host.querySelector('[data-out]').innerHTML = `<div class="card" style="padding:14px">${tbls.map(t => `<div style="margin-bottom:10px"><code>${t.name}</code> <span class="muted" style="font-weight:700;font-size:.88rem">${t.cols.join(', ')}</span></div>`).join('')}</div>`;
}

/* ---------- TRACKER ---------- */
function renderTracker(){
  const t = today(), td = S.days[t] || 0, goal = S.settings.goal, st = streak();
  const lessons = Object.keys(S.done).length;
  const wk = []; for (let k = 6; k >= 0; k--) { const d = new Date(); d.setDate(d.getDate() - k); wk.push(d); }
  const maxV = Math.max(goal, ...wk.map(d => S.days[dkey(d)] || 0));
  const minsWk = Math.round(wk.reduce((a, d) => a + (S.time[dkey(d)] || 0), 0) / 60);
  // month calendar
  const now = new Date(), first = new Date(now.getFullYear(), now.getMonth(), 1), daysIn = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  let cal = ['M','T','W','T','F','S','S'].map(d => `<div class="dow">${d}</div>`).join('') + Array(lead).fill('<div class="d empty"></div>').join('');
  for (let i = 1; i <= daysIn; i++) {
    const k = dkey(new Date(now.getFullYear(), now.getMonth(), i)), v = S.days[k] || 0;
    const l = !v ? '' : v >= goal ? 'l3' : v >= goal/2 ? 'l2' : 'l1';
    cal += `<div class="d ${l} ${k === t ? 'today' : ''}" title="${k}: ${v} XP">${i}${S.goalMet[k] ? `<span class="st">${ICON.star(16)}</span>` : ''}</div>`;
  }
  view.innerHTML = `<div class="eyebrow">Daily tracker</div><h1 class="h-page">My Learning Tracker</h1>
   <p class="lead">${td >= goal ? `Goal done for today! Anything more is bonus brain power.` : `Earn ${goal - td} more XP today to hit your goal and keep your flame alive.`}</p>
   <div class="tiles">
    <div class="tile card"><div class="row" style="gap:8px">${ICON.flame(34)}<span class="num">${st}</span></div><div class="lbl">day streak · best ${S.bestStreak}</div></div>
    <div class="tile card"><div class="row" style="gap:8px">${ring(td/goal, 40)}<span class="num">${td}</span></div><div class="lbl">XP today · goal ${goal}</div></div>
    <div class="tile card"><span class="num">${S.xp}</span><div class="lbl">total XP · level ${levelOf(S.xp)}</div></div>
    <div class="tile card"><span class="num">${lessons}</span><div class="lbl">lessons, bosses and projects done</div></div>
    <div class="tile card"><span class="num">${minsWk}</span><div class="lbl">minutes learning this week</div></div>
    <div class="tile card"><span class="num">${Object.keys(S.badges).length}</span><div class="lbl">badges of ${BADGES.length}</div></div>
   </div>
   <div class="two">
    <div class="card" style="padding:18px"><h2 style="font-size:1.3rem;margin-bottom:12px">${now.toLocaleDateString(undefined, {month:'long', year:'numeric'})}</h2><div class="cal">${cal}</div>
      <div class="row muted" style="margin-top:12px;font-size:.82rem;font-weight:800;gap:14px"><span>Darker green = more XP</span><span class="row" style="gap:4px">${ICON.star(16)} goal reached</span></div></div>
    <div class="card" style="padding:18px"><h2 style="font-size:1.3rem;margin-bottom:12px">Last 7 days</h2>
      <div class="bars"><div class="goal-line" style="bottom:${(goal/maxV)*(150-24)+24}px"><span>goal ${goal}</span></div>
      ${wk.map((d, i) => { const v = S.days[dkey(d)] || 0; return `<div class="b"><em>${v || ''}</em><i style="height:${Math.max(4, v/maxV*126)}px;animation-delay:${i*80}ms;${v >= goal ? 'background:var(--mint)' : ''}"></i><span>${d.toLocaleDateString(undefined, {weekday:'short'}).slice(0, 2)}</span></div>`; }).join('')}</div></div>
   </div>
   <h2 class="section-h">My journal</h2>
   <div class="jlist">${S.journal.length ? S.journal.slice(0, 15).map(j => `<div class="jitem"><small>${esc(j.d)} · ${esc(j.lesson)}</small>${esc(j.text)}</div>`).join('') : `<div class="jitem">Nothing here yet. After each lesson, teach Byte what you learned. Explaining things is the #1 way to remember them!</div>`}</div>`;
}

/* ---------- CLOSET ---------- */
function renderCloset(){
  view.innerHTML = `<div class="eyebrow">Byte's closet</div><h1 class="h-page">Closet and Badges</h1>
   <p class="lead">Spend coins to dress up Byte. Earn coins from lessons, bosses, arena puzzles and your daily goal.</p>
   <div class="closet"><div class="stagecard card"><div id="bigByte">${byteSVG({size:170, mood:'happy'})}</div>
     <div class="pill" style="display:inline-flex;margin-top:10px">${ICON.coin()} ${S.coins} coins</div></div>
    <div><h2 class="section-h" style="margin-top:0">Hats</h2><div class="shop">${shopItems('hat')}</div>
     <h2 class="section-h">Colors</h2><div class="shop">${shopItems('color')}</div>
     <h2 class="section-h">Badges</h2><div class="badges">${BADGES.map(b => `<div class="badge card ${S.badges[b.id] ? '' : 'off'}">${medal(b.color, b.g)}<span>${esc(b.name)}</span><small>${esc(b.desc)}</small></div>`).join('')}</div></div></div>`;
  $$('[data-item]', view).forEach(b => b.onclick = () => {
    const it = SHOP.find(x => x.id === b.dataset.item), owned = S.owned.includes(it.id);
    if (!owned) {
      if (S.coins < it.price) { sfx.bad(); toast(`You need ${it.price - S.coins} more coins. Do a lesson to earn some!`); return; }
      S.coins -= it.price; S.owned.push(it.id); sfx.coin(); confetti(centerOf(b).x, centerOf(b).y, 50); toast(`You bought the ${esc(it.name)}!`);
    }
    if (it.kind === 'hat') S.wear.hat = S.wear.hat === it.id && owned ? '' : it.id; else S.wear.color = it.id;
    save(); checkBadges(); renderStats(); renderCloset(); sfx.good();
  });
}
function shopItems(kind){
  return SHOP.filter(i => i.kind === kind).map(i => {
    const owned = S.owned.includes(i.id), wearing = kind === 'hat' ? S.wear.hat === i.id : S.wear.color === i.id;
    const pic = kind === 'hat' ? byteSVG({size:74, hat:i.id}) : `<span class="swatch" style="background:${BYTE_COLORS[i.id][0]}"></span>`;
    return `<button class="item card ${wearing ? 'wearing' : ''}" data-item="${i.id}">${pic}<span>${esc(i.name)}</span>
      <span class="muted" style="font-size:.85rem">${wearing ? 'Wearing ✓' : owned ? 'Tap to wear' : `${ICON.coin(16)} ${i.price}`}</span></button>`;
  }).join('');
}

/* =====================================================================
   TIME TRACKING + BOOT
   ===================================================================== */
let lastAct = Date.now();
['pointerdown','keydown'].forEach(ev => addEventListener(ev, () => lastAct = Date.now(), {passive:true}));
setInterval(() => {
  if (document.hidden || Date.now() - lastAct > 90000) return;
  const t = today(); S.time[t] = (S.time[t] || 0) + 20;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
}, 20000);
setInterval(() => { if (!document.hidden && Date.now() - lastAct < 90000) save(); }, 120000);

function refreshAll(){ renderStats(); if (!P) go(route); }
window.__selftest = () => {
  const out = [];
  const all = [...PATH.map(n => [n, n.db || 'pets']), ...PROJECTS.map(p => [p, p.db])];
  all.forEach(([n, ds]) => n.steps.forEach((s, i) => {
    if (s.t === 'code') { const r = runSQL(s.sol, ds, s.check); if (!r.ok || !r.res || !r.res.values.length) out.push(`${n.id}#${i}: ${r.err || 'empty'}`); }
    if (s.t === 'build') { const r = runSQL(s.answer, ds); if (!r.ok) out.push(`${n.id}#${i}: ${r.err}`); }
    if (s.show) { const r = runSQL('SELECT * FROM ' + s.show, ds); if (!r.ok) out.push(`${n.id}#${i} show: ${r.err}`); }
  }));
  ARENA.forEach(a => { const r = runSQL(a.sol, 'arena'); if (!r.ok || !r.res || !r.res.values.length) out.push(`${a.id}: ${r.err || 'empty'}`); });
  return out.length ? out : 'all solutions OK';
};
renderNav(); renderStats();
view.innerHTML = `<div class="finish card">${byteSVG({size:120, mood:'think'})}<h2>Byte is waking up the database…</h2></div>`;
sqlReady.then(s => {
  if (!s) { view.innerHTML = `<div class="finish card">${byteSVG({size:120, mood:'sad'})}<h2>The SQL engine couldn't load.</h2><p class="muted" style="font-weight:700">Check your internet connection and reload the page.</p></div>`; return; }
  go('map');
});
initCloud();
</script>
